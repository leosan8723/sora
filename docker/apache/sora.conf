# Sora production vhost (built into the container by the Dockerfile).
#
# Document root is the Laravel public directory, same contract as the
# validated shared-hosting deployment: static files under /build/* are served
# directly, everything else is rewritten to index.php by public/.htaccess and
# handled by Laravel (SPA shell catch-all, admin shell, JSON API).
#
# HTTPS is terminated by Railway's reverse proxy; the X-Forwarded-* headers
# are consumed by Laravel's trusted-proxies middleware (bootstrap/app.php).

<VirtualHost *>
    ServerName localhost
    DocumentRoot /var/www/sora/public

    <Directory /var/www/sora/public>
        Options -MultiViews -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ServerSignature Off

    # Logs go to the container stdout/stderr so Railway streams them.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
